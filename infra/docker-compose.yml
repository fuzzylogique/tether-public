# Vultr VM. `infra/deploy.sh <ip>` runs this for you; by hand:
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build                # dashboard + Caddy
#   docker compose -f infra/docker-compose.yml --env-file .env --profile bot up -d --build  # ...and the Discord bot
# The bot is a profile because a Discord token may only hold ONE gateway connection: start it on the VM only
# after the laptop's `pnpm dev:server` is stopped, or both will answer every interaction.
services:
  server:
    build: { context: .., dockerfile: infra/Dockerfile.server }
    env_file: ../.env
    environment:
      - SERVER_PORT=3001
    restart: unless-stopped
    expose: ["3001"]
    profiles: ["bot"]

  web:
    build: { context: .., dockerfile: infra/Dockerfile.web }
    env_file: ../.env
    restart: unless-stopped
    expose: ["3000"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on: [web]
